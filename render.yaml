services:
  - type: web
    name: market-intelligence-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: mic-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DUCKDB_PATH
        value: /var/data/orders.db
