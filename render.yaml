services:
  - type: web
    name: market-intelligence-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
